
name: 01 - Flask CI Pipeline
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  flask-ci-job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Build Docker Image
        run: docker build -t demo-flask-app:${{ github.sha }} .

      - name: Run Container
        run: docker run -d -p 5000:5000 --name demo-flask-container demo-flask-app:${{ github.sha }}

      - name: Smoke Test
        run: |
          for i in {1..10}; do
            curl -sf http://localhost:5000/health && break
            echo "Waiting for app to start..."
            sleep 3
          done
          curl -f http://localhost:5000/health

      - name: Cleanup
        if: always()
        run: docker rm -f demo-flask-container || true
